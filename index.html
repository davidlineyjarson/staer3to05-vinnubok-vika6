  <header><div class="shell"><p class="eyebrow">STÆR3TÖ05 · Vika 6</p><h1>Vinnubók 6</h1><p class="lead">Líkindareglur, líkindadreifing og tvíliðaformúlan. Vinna og framvinda vistast sjálfkrafa í þessum vafra.</p></div></header>

  <script>
  (()=>{
    'use strict';
    const STORE='STAER3TO05_VIKA6_v1';
    const tabs=[['tuesday','Þriðjudagur'],['wednesday','Miðvikudagur'],['thursday','Fimmtudagur'],['friday','Föstudagur'],['weekly','Vikuskil']];
    const disabledTabs=new Set(['thursday']);
    const dayMap={tuesday:'thridjudagur',wednesday:'midvikudagur',thursday:'fimmtudagur',friday:'fostudagur'};
    const dayNames={tuesday:'Þriðjudagur',wednesday:'Miðvikudagur',thursday:'Fimmtudagur',friday:'Föstudagur'};
    const core={tuesday:['TRI_A1','TRI_A2','TRI_A3','TRI_B','TRI_LOK'],wednesday:['MID6_A','MID6_GROUP','MID6_B1','MID6_B2','MID6_B3','MID6_LOK'],thursday:['FIM_A1','FIM_A2','FIM_A3','FIM_B','FIM_LOK'],friday:['FOS67_READ','FOS65_BINOM','FOS62_BOOK3','FOS62_BOOK6','FOS62_BOOK5','FOS65_EXIT']};
    const initial=()=>({version:'1.0',lastUpdated:'',activeTab:'tuesday',progress:{completedCoreTasks:0,totalCoreTasks:22,percent:0},days:{thridjudagur:{},midvikudagur:{},fimmtudagur:{},fostudagur:{}}});
    function load(){try{const raw=JSON.parse(localStorage.getItem(STORE));const base=initial();if(!raw||typeof raw!=='object')return base;return{...base,...raw,progress:{...base.progress,...(raw.progress||{})},days:{thridjudagur:{...(raw.days?.thridjudagur||{})},midvikudagur:{...(raw.days?.midvikudagur||{})},fimmtudagur:{...(raw.days?.fimmtudagur||{})},fostudagur:{...(raw.days?.fostudagur||{})}}}}catch{return initial()}}
    const state=load();
    const dayState=day=>state.days[dayMap[day]];
    const task=(day,id)=>dayState(day)[id]||(dayState(day)[id]={status:'pending',attempts:0});
    function isComplete(day,id){const groups={TRI_A1:['TRI_A1_1','TRI_A1_2','TRI_A1_3','TRI_A1_4'],MID_A1:['MID_A1_1','MID_A1_2','MID_A1_3'],MID6_A:['MID6_A_1','MID6_A_2','MID6_A_3'],FIM_A1:['FIM_A1_1','FIM_A1_2'],FOS6_A:['FOS6_A_1','FOS6_A_2'],FOS62_EXIT:['FOS62_EXIT_1','FOS62_EXIT_2'],FOS62_LINK:['FOS62_LINK_1','FOS62_LINK_2'],FOS62_EXITR:['FOS6_EXIT','FOS62_EXITR_2A','FOS62_EXITR_2B'],FOS63_READ:['FOS63_READ_1','FOS63_READ_2','FOS63_READ_3','FOS63_READ_4'],FOS63_EXIT:['FOS6_EXIT','FOS62_EXIT_1'],FOS65_READ:['FOS65_READ_1','FOS65_READ_2','FOS65_READ_3'],FOS66_READ:['FOS66_READ_1','FOS66_READ_2','FOS66_READ_3','FOS66_READ_4'],FOS67_READ:['FOS67_READ_1','FOS67_READ_2','FOS67_READ_3','FOS67_READ_4'],FOS65_EXIT:['FOS65_EXIT_1','FOS65_EXIT_2']};if(groups[id])return groups[id].every(x=>task(day,x).status==='completed');return task(day,id).status==='completed'}
    function progress(){let done=0,total=0;Object.entries(core).forEach(([day,ids])=>{total+=ids.length;done+=ids.filter(id=>isComplete(day,id)).length});return{done,total,percent:total?Math.round(done/total*100):0}}
    function save(){const p=progress();state.progress={completedCoreTasks:p.done,totalCoreTasks:p.total,percent:p.percent};state.lastUpdated=new Date().toISOString();localStorage.setItem(STORE,JSON.stringify(state))}
    const q={};
    function addQuiz(day,id,question,options,correct,ok,hint){q[id]={day,id,question,options,correct,ok,hint};return q[id]}
    addQuiz('tuesday','TRI_A1_1','Teningi er kastað einu sinni. Hverjar eru líkurnar á að fá 1 eða 6?',['Samlagningsregla (sundurlægir atburðir): \\(P(1 \\text{ eða } 6)=P(1)+P(6)\\)','Margföldunarregla: \\(P(1 \\text{ og } 6)=P(1)\\cdot P(6)\\)'],1,'Rétt! Atburðirnir geta ekki gerst samtímis. Við leggjum saman: \\(\\frac16+\\frac16=\\frac13\\).','Teningnum er kastað einu sinni. Getur sama kast skilað bæði 1 og 6?');
    addQuiz('tuesday','TRI_A1_2','Teningi er kastað tvisvar. Hverjar eru líkurnar á að fá 6 í fyrra kastinu og 6 í seinna kastinu?',['Samlagningsregla: \\(P(6)+P(6)\\)','Margföldunarregla: \\(P(6)\\cdot P(6)\\)'],2,'Rétt! Þetta eru tveir sjálfstæðir atburðir í röð: \\(\\frac16\\cdot\\frac16=\\frac1{36}\\).','Tilraunin samanstendur af tveimur köstum í röð og spurt er um fyrra og seinna kastið.');
    addQuiz('tuesday','TRI_A1_3','Spil er dregið úr 52 spila stokki og því skilað aftur. Síðan er annað spil dregið. Hverjar eru líkurnar á að fá gosa í bæði skiptin?',['Samlagningsregla: \\(P(\\text{gosi})+P(\\text{gosi})\\)','Margföldunarregla: \\(P(\\text{gosi})\\cdot P(\\text{gosi})\\)'],2,'Rétt! Drættirnir eru óháðir: \\(\\frac4{52}\\cdot\\frac4{52}=\\frac1{169}\\).','Tveir drættir eiga sér stað í röð. Spilinu er skilað og fjöldinn breytist því ekki.');
    addQuiz('tuesday','TRI_A1_4','Í poka eru 3 gular og 5 bláar kúlur. Dregnar eru tvær kúlur án skila. Hverjar eru líkurnar á að fá fyrst gula og síðan bláa?',['Margföldun háðra líkinda: \\(P(G_1)\\cdot P(B_2\\mid G_1)\\)','Samlagning líkinda: \\(P(G_1)+P(B_2)\\)'],1,'Rétt! Eftir fyrri drátt eru 7 kúlur eftir: \\(\\frac38\\cdot\\frac57=\\frac{15}{56}\\).','Þetta eru tvö skref í röð. Athugaðu hve margar kúlur eru eftir í seinni drætti.');
    addQuiz('tuesday','TRI_A3','Jón leggur saman \\(\\frac16+\\frac16\\) til að finna líkurnar á a.m.k. einum sexa í tveimur köstum. Hvers vegna er það rangt?',['Hann gleymdi að margfalda brotin.','Atburðirnir eru ekki sundurlægir; útkoman \\((6,6)\\) er tvítalin.','Hann átti að deila með 2.'],2,'Rétt! Atburðirnir skarast í útkomunni \\((6,6)\\). Réttar líkur eru \\(\\frac{11}{36}\\), ekki \\(\\frac{12}{36}\\).','Skoðaðu útkomuna þar sem sexa kemur upp í báðum köstum.');
    addQuiz('tuesday','TRI_LOK','Spil er dregið tvisvar úr 52 spila stokki án skila. Hvaða uppsetning gefur líkurnar á tveimur hjörtum?',['\\(\\frac{13}{52}\\cdot\\frac{13}{52}\\)','\\(\\frac{13}{52}+\\frac{12}{51}\\)','\\(\\frac{13}{52}\\cdot\\frac{12}{51}\\)','\\(\\frac{13}{52}\\cdot\\frac{13}{51}\\)'],3,'Rétt! Í seinna drætti eru 12 hjörtu eftir af 51 spili.','Tveir drættir eru í röð og dregið er án skila.');
    const midA1=[
      addQuiz('wednesday','MID_A1_1','Óskekktri krónu er kastað. Árangur er þorskur.',['\\(p=0{,}5,\\ q=0{,}5\\)','\\(p=\\frac16,\\ q=\\frac56\\)','\\(p=0{,}2,\\ q=0{,}8\\)'],1,'Rétt! Hér eru báðar útkomur jafnlíklegar.','Notaðu \\(q=1-p\\).'),
      addQuiz('wednesday','MID_A1_2','Sexhliða teningi er kastað. Árangur er að fá sexa.',['\\(p=0{,}5,\\ q=0{,}5\\)','\\(p=\\frac16,\\ q=\\frac56\\)','\\(p=\\frac56,\\ q=\\frac16\\)'],2,'Rétt! Ein hlið af sex gefur árangur.','Líkurnar á sexa eru ein hagstæð útkoma af sex.'),
      addQuiz('wednesday','MID_A1_3','Giskað er á krossapróf með 5 valmöguleikum. Árangur er rétt svar.',['\\(p=0{,}2,\\ q=0{,}8\\)','\\(p=0{,}5,\\ q=0{,}5\\)','\\(p=0{,}8,\\ q=0{,}2\\)'],1,'Rétt! Einn af fimm valmöguleikum er réttur.','Reiknaðu \\(1/5\\) og notaðu síðan \\(q=1-p\\).')
    ];
    addQuiz('wednesday','MID_A3','Skoðaðu stöplaritið fyrir \\(N=4\\) krónuköst á bls. 138. Hver er hæð stöpulsins fyrir \\(X=2\\), og hvers vegna er hann hæstur?',['\\(0{,}2500\\), því 2 er helmingurinn af 4.','\\(0{,}3750\\), því 6 af 16 röðum gefa nákvæmlega 2 þorska.','\\(0{,}5000\\), því líkurnar á þorski eru 0,5.'],2,'Rétt! Sex af 16 jafnlíklegum röðum gefa tvo þorska: \\(\\frac6{16}=0{,}3750\\).','Teldu raðirnar með nákvæmlega tvo þorska af 16 mögulegum röðum.');
    const mid6A=[
      addQuiz('wednesday','MID6_A_1','Teningi er kastað einu sinni. Finna á líkurnar á að fá 2 eða 5. Hvaða aðgerð á við?',['Leggja saman \\(P(2)+P(5)\\).','Margfalda \\(P(2)\\cdot P(5)\\).','Draga \\(P(2)\\) frá \\(P(5)\\).'],1,'Rétt! Í einu kasti eru 2 og 5 tvær ólíkar útkomur. Orðið „eða“ tengir leiðirnar og því leggjum við líkurnar saman.','Getur eitt teningakast sýnt bæði 2 og 5?'),
      addQuiz('wednesday','MID6_A_2','Tveimur teningum er kastað. Fyrri teningurinn sýnir 6. Breytir það líkunum á að seinni teningurinn sýni 6?',['Já, líkurnar verða \\(\\frac1{36}\\).','Nei, líkurnar eru áfram \\(\\frac16\\).','Já, líkurnar verða \\(\\frac26\\).'],2,'Rétt! Köst teninganna eru óháð. Útkoma fyrri teningsins breytir ekki líkunum fyrir þann seinni.','Hvor teningur hefur áfram sex jafnlíklegar hliðar.'),
      addQuiz('wednesday','MID6_A_3','Nemandi reiknar líkurnar á aðeins einni sexu í tveimur teningaköstum sem \\(\\frac16\\cdot\\frac56\\). Hvað vantar?',['Ekkert; þetta er fullur útreikningur.','Að leggja við hina leiðina: ekki sexa og síðan sexa.','Að margfalda svarið með \\(\\frac16\\) aftur.'],2,'Rétt! Aðeins ein sexa getur komið eftir tveimur leiðum. Margfaldað er innan hvorrar leiðar og leiðirnar síðan lagðar saman.','Skráðu báðar mögulegar raðir þar sem nákvæmlega annar teningurinn sýnir sexu.')
    ];
    addQuiz('wednesday','MID6_LOK','Tveimur teningum er kastað. Finna á líkurnar á að fá annaðhvort tvær fimmur eða tvær sexur. Hvaða lýsing á aðferðinni er rétt?',['Leggja saman allar fjórar einstöku líkurnar.','Margfalda eftir hvorri leið og leggja síðan leiðirnar saman.','Margfalda líkurnar á öllum fjórum útkomunum saman.'],2,'Rétt! Innan hverrar leiðar stendur „og“, svo þar er margfaldað. Milli leiðanna stendur „eða“, svo niðurstöðurnar eru lagðar saman.','Skoðaðu fyrst leiðina fimm og fimm, síðan leiðina sex og sex. Hvað tengir skrefin innan leiðar og hvað tengir leiðirnar?');
    const fimA1=[
      addQuiz('thursday','FIM_A1_1','Krónu er kastað 10 sinnum og fjöldi þorska mældur. Er þetta tvíliðatilraun?',['Já.','Nei.'],1,'Rétt! \\(n=10\\), tvær útkomur og föst \\(p=0{,}5\\).','Athugaðu fjölda tilrauna, fjölda mögulegra útkomna og hvort p haldist fast.'),
      addQuiz('thursday','FIM_A1_2','Dregnar eru 4 kúlur úr krukku án skila. Er þetta tvíliðatilraun?',['Já.','Nei.'],2,'Rétt! Án skila breytist \\(p\\) milli drátta og tilraunirnar eru háðar.','Spyrðu hvort líkurnar haldist óbreyttar eftir hvern drátt.')
    ];
    addQuiz('thursday','FIM_LOK','Hvaða uppsetning gefur líkurnar á nákvæmlega 4 þorskum í 10 krónuköstum?',['\\(P=\\binom{10}{4}(0{,}5)^4(0{,}5)^6\\)','\\(P=\\binom4{10}(0{,}5)^{10}(0{,}5)^4\\)','\\(P=10\\cdot(0{,}5)^4\\)','\\(P=\\binom{10}{4}(0{,}4)^5(0{,}6)^5\\)'],1,'Rétt! Hér er \\(n=10\\), \\(k=4\\), \\(n-k=6\\) og \\(p=q=0{,}5\\).','Notaðu n=10 og k=4; þá er n−k=6.');
    addQuiz('friday','FOS_A2','Í flugskeytadæmi er \\(n=5\\). Hvaða líkindi þarf að leggja saman fyrir „a.m.k. 3 hæfa“?',['Aðeins \\(P(k=3)\\).','\\(P(k=3)+P(k=4)+P(k=5)\\).','\\(P(k=1)+P(k=2)+P(k=3)\\).'],2,'Rétt! „A.m.k. 3“ nær yfir 3, 4 og 5.','A.m.k. 3 merkir 3 eða hærra.');
    addQuiz('friday','FOS_LOK','Dæmi spyr um líkurnar á a.m.k. 4 sexum í 6 teningaköstum. Hvaða skref þarf?',['Reikna aðeins \\(P(k=4)\\).','Reikna \\(P(k=4)\\), \\(P(k=5)\\) og \\(P(k=6)\\) og leggja saman.','Reikna \\(P(k=1)+P(k=2)+P(k=3)+P(k=4)\\).','Margfalda \\(P(k=4)P(k=5)P(k=6)\\).'],2,'Rétt! „A.m.k. 4“ felur í sér 4, 5 og 6 árangra.','Skráðu öll möguleg k-gildi sem eru 4 eða hærri.');
    addQuiz('friday','FOS6_EXIT','Hvað verður \\(P(X=2)\\) að vera til þess að þetta sé gild líkindadreifing?',['\\(0{,}20\\)','\\(0{,}35\\)','\\(0{,}65\\)','\\(1{,}00\\)'],2,'Rétt! Summa allra líkinda í líkindadreifingu verður að vera 1.','Leggðu saman þekktu líkurnar og dragðu summuna frá 1.');

    function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
    function parseValue(raw){let s=String(raw??'').trim().replace(/\s/g,'').replace(',','.');if(!s)return NaN;if(s.endsWith('%'))return Number(s.slice(0,-1))/100;if(/^[-+]?\d+(?:\.\d+)?\/[-+]?\d+(?:\.\d+)?$/.test(s)){const[a,b]=s.split('/').map(Number);return b?a/b:NaN}return Number(s)}
    function nearly(a,b){return Number.isFinite(a)&&Math.abs(a-b)<=0.0011}

    function inputCard(id,label,title,intro,table=false){const d=inputTasks[id],s=task(d.day,id),vals=s.inputs||[];let fields=d.labels.map((x,i)=>`<label class="input-field"><span>${x}</span><input class="answer-input" inputmode="decimal" autocomplete="off" data-input-task="${id}" data-input-index="${i}" value="${esc(vals[i])}" aria-label="${esc(x)}"></label>`).join('');if(table&&id==='MID_A2'){const rows=[['0','BBB',0,1],['1','ÞBB, BÞB, BBÞ',2,3],['2','ÞÞB, ÞBÞ, BÞÞ',4,5],['3','ÞÞÞ',6,7]];fields=`<div class="distribution-wrap"><table class="distribution-table"><thead><tr><th>X</th><th>Mögulegar raðir</th><th>Fjöldi raða</th><th>P(X)</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td><input class="answer-input" inputmode="decimal" data-input-task="${id}" data-input-index="${r[2]}" value="${esc(vals[r[2]])}" aria-label="X ${r[0]}, fjöldi raða"></td><td><input class="answer-input" inputmode="decimal" data-input-task="${id}" data-input-index="${r[3]}" value="${esc(vals[r[3]])}" aria-label="X ${r[0]}, líkur"></td></tr>`).join('')}</tbody></table></div>`}else if(table&&id==='FOS6_A_2'){const rows=[['0','BB','1',0,null],['1','ÞB, BÞ',null,null,'0,50'],['2','ÞÞ','1',2,null]];fields=`<div class="distribution-wrap"><table class="distribution-table"><thead><tr><th>X</th><th>Mögulegar raðir</th><th>Fjöldi raða</th><th>P(X)</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]??`<input class="answer-input" inputmode="decimal" data-input-task="${id}" data-input-index="1" value="${esc(vals[1])}" aria-label="X 1, fjöldi raða">`}</td><td>${r[4]??`<input class="answer-input" inputmode="decimal" data-input-task="${id}" data-input-index="${r[3]}" value="${esc(vals[r[3]])}" aria-label="X ${r[0]}, líkur">`}</td></tr>`).join('')}</tbody></table></div>`}else fields=`<div class="input-grid">${fields}</div>`;const note=d.requireNote?`<label class="input-field"><span>${d.noteLabel}</span><textarea data-note-task="${id}" aria-label="${esc(d.noteLabel)}">${esc(s.note)}</textarea></label>`:'';return `<article class="card quiz-card" data-input-card="${id}"><div class="card-top"><span class="number">${label}</span><span class="card-tag">Gagnvirk leiðsögn</span></div><h3>${title}</h3><p>${intro}</p>${fields}${note}<button class="primary check-button" type="button" data-check-input="${id}">Athuga</button><div class="feedback" data-input-feedback="${id}" role="status" aria-live="polite"></div><p class="attempt-count" data-input-attempt="${id}" hidden></p></article>`}
    function reasonCard(id,label,title,intro){const d=reasonTasks[id],s=task(d.day,id);return `<article class="card quiz-card" data-reason-card="${id}"><div class="card-top"><span class="number">${label}</span><span class="card-tag">Túlkun og rökstuðningur</span></div><h3>${title}</h3><p>${intro}</p><textarea style="min-height:170px" data-reason-task="${id}" aria-label="Rökstuðningur" placeholder="${esc(d.placeholder||'Skrifaðu 2–3 setningar með eigin orðum.')}">${esc(s.response)}</textarea><button class="primary check-button" type="button" data-check-reason="${id}">Vista svar</button><div class="feedback" data-reason-feedback="${id}" role="status" aria-live="polite"></div></article>`}
    function matchCard(id,label,title,intro){const d=matchTasks[id],s=task(d.day,id),pairs=s.pairs||[];return `<article class="card quiz-card" data-match-card="${id}"><div class="card-top"><span class="number">${label}</span><span class="card-tag">Pörun</span></div><h3>${title}</h3><p>${intro}</p><div class="matching-grid">${d.terms.map((term,i)=>`<label class="matching-row"><span class="matching-term">${term}</span><select class="match-select" data-match-task="${id}" data-match-index="${i}"><option value="">Veldu</option>${d.choices.map((c,j)=>`<option value="${j+1}" ${pairs[i]===j+1?'selected':''}>${c}</option>`).join('')}</select></label>`).join('')}</div><button class="primary check-button" type="button" data-check-match="${id}">Athuga</button><div class="feedback" data-match-feedback="${id}" role="status" aria-live="polite"></div><p class="attempt-count" data-match-attempt="${id}" hidden></p></article>`}
    function bCard(day,id,label,title,body,extra=false){const s=task(day,id);return `<article class="card book-task"><div class="card-top"><span class="number">${label}</span><span class="card-tag">Sjálfstæð vinna á blaði</span></div><h3>${title}</h3><div class="task-body">${body}</div><div class="check-stack"><label class="task-check"><input type="checkbox" data-core-check="${id}" data-day="${day}" ${s.checked?'checked':''}><span>${extra?'Ég hef leyst kjarnadæmin 5a–c og 7a–b á blaði.':'Ég hef lokið verkefninu og varðveiti vinnuna.'}</span></label>${extra?`<label class="task-check"><input type="checkbox" data-extra-check="FOS_B" data-day="friday" ${s.extra_checked?'checked':''}><span>(Valfrjálst) Ég hef leyst aukadæmin 11b–d á blaði.</span></label>`:''}</div></article>`}

    function tuesday(){return `<div class="panel" id="panel-tuesday">${dayIntro('tuesday','Líkindareglur og líkindatré',['velja samlagningu fyrir sundurlæga atburði og margföldun fyrir atburði í röð;','fylla út líkindatré án skila;','greina skörun og tvítalningu.'],[['Líkindi.pdf','Opna Líkindi.pdf']])}${sectionLabel('A','Gagnvirk leiðsögn','Byrjaðu á að greina aðstæðurnar. Reiknaðu síðan og athugaðu skilninginn.')}${quizCard('A1','Hvaða regla á við?',[q.TRI_A1_1,q.TRI_A1_2,q.TRI_A1_3,q.TRI_A1_4])}${inputCard('TRI_A2','A2','Fylltu út líkindatréð','Í poka eru 3 gular og 5 bláar kúlur. Tvær eru dregnar án skila. Skráðu líkur á hverri grein.')}${quizCard('A3','Villugreining',[q.TRI_A3])}</section>${sectionLabel('B','Sjálfstæð vinna')}${bCard('tuesday','TRI_B','B','Dæmi 5, 7 og 8',`<p class="book-reference">Æfing 9.1 · bls. 137–138</p><p>Leystu dæmi 5, 7 og 8 í stílabókina. Teiknaðu líkindatré þar sem það á við.</p>`)}</section>${sectionLabel('C','Túlkun og rökstuðningur')}${selfCard('tuesday','TRI_C','Af hverju verður summan 1?','Líkindatré greinist út frá einum hnúti. Hvers vegna er summa líkinda á öllum greinum frá sama hnúti alltaf 1? Skrifaðu 1–2 setningar á blað.','Greinarnar ná yfir allar mögulegar næstu útkomur. Ein þeirra verður að gerast og þær útiloka hver aðra, svo samanlögð líkindi eru 1.')}</section>${sectionLabel('Lok','Stöðumat dagsins')}${quizCard('Lok','Tvö hjörtu án skila',[q.TRI_LOK],'Leifturpróf')}</section><div class="completion" data-day-complete="tuesday"><strong>Kjarnavinnu þriðjudags er lokið.</strong></div></div>`}
    function wednesday(){const group=task('wednesday','MID6_GROUP');return `<div class="panel" id="panel-wednesday">${dayIntro('wednesday','Líkindareikningur festur í sessi',['velja samlagningu fyrir „eða“ og margföldun fyrir „og“;','greina óháða atburði;','sameina reglurnar þegar atburður getur gerst eftir fleiri en einni leið.'],[['Líkindi.pdf','Opna Líkindi.pdf']])}${sectionLabel('A','Virk endurheimt','Svaraðu stuttum greiningarspurningum út frá því sem þú vannst með á þriðjudegi.')}${quizCard('A','Hvaða regla á við?',mid6A,'Virk endurheimt')}</section>${sectionLabel('Hóp','Teningalíkindi í verki','Vinnið 3–4 saman með tvo sexhliða teninga. Skráið spá, útreikninga, niðurstöður og lokaályktun.')}<article class="card book-task"><div class="card-top"><span class="number">Hóp</span><span class="card-tag">3–4 saman</span></div><h3>Spáið, reiknið og prófið</h3><div class="task-body"><div class="day-goals"><strong>Atburðirnir</strong><ul><li><strong>Atburður A:</strong> Báðir teningar sýna slétta tölu.</li><li><strong>Atburður B:</strong> Nákvæmlega annar teningurinn sýnir sexu.</li></ul></div><ol class="core-list"><li><strong>Spáið áður en þið reiknið.</strong> Ræðið hvort A eða B sé líklegra og skráið sameiginlega spá hópsins.</li><li><strong>Reiknið fræðilegar líkur.</strong> Finnið \\(P(A)\\) og \\(P(B)\\). Fyrir B skuluð þið skrá báðar leiðirnar áður en þið reiknið:<ul><li>fyrri teningur sýnir sexu og sá seinni ekki;</li><li>fyrri teningur sýnir ekki sexu en sá seinni gerir það.</li></ul></li><li><strong>Berið saman við spána.</strong> Skráið hvort útreikningarnir styðja upphaflegu spána ykkar.</li><li><strong>Prófið með teningum.</strong> Kastið báðum teningum 12–24 sinnum eftir því sem tími leyfir. Skráið heildarfjölda kasta og hve oft A og B gerast.<div class="formula-fill">\\[\\text{tilraunahlutfall}=\\frac{\\text{fjöldi skipta sem atburður gerðist}}{\\text{fjöldi kasta}}\\]</div></li><li><strong>Berið saman niðurstöðurnar.</strong> Reiknið tilraunahlutfall A og B og berið það saman við fræðilegu líkurnar.</li><li><strong>Dragið ályktun.</strong> Þýðir munur á tilraunahlutfalli og fræðilegum líkum að fræðilegi útreikningurinn sé rangur? Skráið rökstutt svar í 1–2 setningum.</li></ol><div class="day-goals"><strong>Kjarnahugsun</strong><p><strong>OG → margfalda</strong></p><p><strong>EÐA → leggja saman</strong></p></div></div><label class="task-check"><input type="checkbox" data-core-check="MID6_GROUP" data-day="wednesday" ${group.checked?'checked':''}><span>Við höfum lokið hópverkefninu og varðveitt spá, útreikninga, niðurstöður og ályktun.</span></label></article></section>${sectionLabel('B','Sjálfstæð reiknivinna','Finndu dæmin á bls. 137 í Líkindi.pdf. Skráðu uppsetningu og útreikninga á blað.')}${bCard('wednesday','MID6_B1','B1','„Eða“ – samlagning',`<p class="book-reference">Æfing 9.1 · dæmi 4b–c · bls. 137</p><p><strong>Leystu liðina.</strong> Skráðu hvaða útkomur tilheyra hvorum atburði og hvaða líkur þú leggur saman.</p>`)}${bCard('wednesday','MID6_B2','B2','„Og“ – margföldun',`<p class="book-reference">Æfing 9.1 · dæmi 5 · bls. 137</p><p><strong>Leystu dæmið.</strong> Skráðu líkurnar í hvorum drætti og útskýrðu stuttlega hvers vegna þú margfaldar þær.</p>`)}${bCard('wednesday','MID6_B3','B3','Sameinaðu reglurnar',`<p class="book-reference">Æfing 9.1 · dæmi 6b · bls. 137</p><p><strong>Leystu liðinn.</strong> Skráðu fyrst öll teningapör sem gefa summuna 8. Reiknaðu síðan líkurnar með því að margfalda innan hverrar leiðar og leggja leiðirnar saman.</p>`)}<article class="card optional-card"><div class="card-top"><span class="number">Meira</span><span class="card-tag">Valfrjáls áskorun · telur ekki í framvindu</span></div><h3>A.m.k. 10</h3><p class="book-reference">Æfing 9.1 · dæmi 6c · bls. 137</p><p><strong>Leystu liðinn.</strong> Skráðu fyrst öll teningapör sem gefa summu sem er að minnsta kosti 10. Reiknaðu síðan líkurnar.</p></article></section>${sectionLabel('Lok','Exit-athugun')}${quizCard('Lok','Leggja saman eð     function thursday(){return `<div class="panel" id="panel-thursday">${dayIntro('thursday','6.2 · Tvíliðaformúlan',['greina skilyrði tvíliðatilraunar;','túlka liði formúlunnar;','greina n, k, p og q úr dæmatexta.'],[['tolfræði6.pdf','Opna tolfræði6.pdf']])}${sectionLabel('A','Gagnvirk leiðsögn')}${quizCard('A1','Er þetta tvíliðatilraun?',fimA1)}${matchCard('FIM_A2','A2','Hvað merkja liðirnir?','Tengdu hvern lið við rétta merkingu.')}${inputCard('FIM_A3','A3','Greindu breyturnar','Á krossaprófi eru 6 spurningar og 3 valmöguleikar við hverja. Giskað er á allt. Skráðu gildin fyrir nákvæmlega 3 rétt svör.')}</section>${sectionLabel('B','Sjálfstæð vinna')}${bCard('thursday','FIM_B','B','Dæmi 3a–b, 6 og 10a',`<p class="book-reference">Æfing 6.2 · bls. 142–143</p><p>Leystu dæmi 3a–b, 6 og 10a á blað. Skrifaðu upp \\(n\\), \\(k\\), \\(p\\) og \\(q\\) fyrir hvert dæmi.</p>`)}</section>${sectionLabel('C','Túlkun og rökstuðningur')}${selfCard('thursday','FIM_C','Af hverju má ekki nota formúluna?','Nemandi notar tvíliðaformúluna þegar fjórar kúlur eru dregnar án skila. Hvaða skilyrði formúlunnar er brotið? Skrifaðu svar á blað.','Án skila breytist p eftir hvern drátt. Tilraunirnar eru því háðar, en tvíliðaformúlan krefst óháðra tilrauna með fast p.')}</section>${sectionLabel('Lok','Stöðumat dagsins')}${quizCard('Lok','Nákvæmlega fjórir þorskar',[q.FIM_LOK],'Leifturpróf')}</section><div class="completion" data-day-complete="thursday"><strong>Kjarnavinnu fimmtudags er lokið.</strong></div></div>`}
    function friday(){const answer3=`<p><strong>a) Nákvæmlega 2 sexur:</strong> \\(n=5,\\ k=2,\\ p=\\frac16,\\ q=\\frac56\\)</p>\\[\\binom{5}{2}=10\\]\\[P(2)=\\binom{5}{2}\\left(\\frac16\\right)^2\\left(\\frac56\\right)^3=\\frac{625}{3888}\\approx0{,}1608\\quad(16{,}1\%)\\]<p><strong>b) Nákvæmlega 3 sexur:</strong> \\(n=5,\\ k=3,\\ p=\\frac16,\\ q=\\frac56\\)</p>\\[\\binom{5}{3}=10\\]\\[P(3)=\\binom{5}{3}\\left(\\frac16\\right)^3\\left(\\frac56\\right)^2=\\frac{125}{3888}\\approx0{,}0321\\quad(3{,}2\%)\\]`;const answer6=`<p>\\(n=6,\\ k=2,\\ p=\\frac15,\\ q=\\frac45\\)</p>\\[\\binom{6}{2}=15\\]\\[P(2)=\\binom{6}{2}\\left(\\frac15\\right)^2\\left(\\frac45\\right)^4=\\frac{768}{3125}\\approx0{,}2458\\quad(24{,}6\%)\\]`;const answer5=`<p><strong>a) Nákvæmlega einu sinni:</strong> \\(n=5,\\ k=1,\\ p=0{,}4,\\ q=0{,}6\\)</p>\\[\\binom{5}{1}=5\\]\\[P(1)=\\binom{5}{1}(0{,}4)^1(0{,}6)^4=0{,}2592\\quad(25{,}9\%)\\]<p><strong>b) Nákvæmlega tvisvar:</strong> \\(n=5,\\ k=2,\\ p=0{,}4,\\ q=0{,}6\\)</p>\\[\\binom{5}{2}=10\\]\\[P(2)=\\binom{5}{2}(0{,}4)^2(0{,}6)^3=0{,}3456\\quad(34{,}6\%)\\]`;const answer9=`<p>\\(n=10,\\ k=6,\\ p=\\frac12,\\ q=\\frac12\\)</p>\\[\\binom{10}{6}=210\\]\\[P(6)=\\binom{10}{6}\\left(\\frac12\\right)^6\\left(\\frac12\\right)^4=\\frac{105}{512}\\approx0{,}2051\\quad(20{,}5\%)\\]`;return `<div class="panel" id="panel-friday">${sectionLabel('A','Lestur – 6.1','Lestu kafla 6.1 á bls. 135–138 í kennslubókinni.')}${quizCard('A1–A4','Hugtök úr lestrinum',fos67Read,'Hugtakaskilningur')}</section>${sectionLabel('A','Tvíliðaformúlan')}<article class="card"><div class="formula-fill">\\[P=\\binom{n}{k}p^kq^{n-k}\\]</div><div class="day-goals"><p>\\(n\\) = fjöldi tilrauna</p><p>\\(k\\) = fjöldi árangra</p><p>\\(p\\) = líkur á árangri</p><p>\\(q\\) = líkur á að fá ekki árangur</p><div class="formula-fill">\\[q=1-p\\]</div></div></article></section>${sectionLabel('A','Fyrsta studda beiting','Greindu stærðirnar. Reiknaðu síðan lokaútkomuna á blað.')}${inputCard('FOS65_BINOM','A','Tvær sexur í fimm köstum','Teningi er kastað 5 sinnum. Hverjar eru líkurnar á að fá nákvæmlega 2 sexur? Fylltu inn n, k, p og q.')}</section>${sectionLabel('B','Sjálfstæð bókadæmi','Opnaðu kennslubókina á bls. 142 og reiknaðu dæmin á blað eða í stílabók.')}${answerBookCard('FOS62_BOOK3','B1','Dæmi 3 – bls. 142',answer3)}${answerBookCard('FOS62_BOOK6','B2','Dæmi 6 – bls. 142',answer6)}${answerBookCard('FOS62_BOOK5','B3','Dæmi 5 – bls. 142',answer5)}${answerBookCard('FOS62_EXTRA9','Auka','Dæmi 9 – bls. 142 · Ef tími vinnst',answer9,true)}</section>${sectionLabel('Exit','Stutt einstaklingsathugun')}${quizCard('E1–E2','Tvíliðaformúlan',fos65Exit,'Stutt stöðumat')}</section><div class="completion" data-day-complete="friday"><strong>Kjarnavinnu föstudags er lokið.</strong></div></div>`}
    function weekly(){return `<div class="panel" id="panel-weekly"><section><p class="section-kicker">Vika 6 · Yfirlit</p><h2>Vikuskil</h2><p class="section-intro">Yfirlitið tekur aðeins mið af skylduvinnu vikunnar. Valfrjáls C-verkefni og aukadæmi telja ekki.</p><div class="card" id="weekSnapshot"><h3>Framvinduyfirlit · Vika 6</h3><div class="week-grid-wrap"><div class="week-grid" id="weekGrid"></div></div><div class="week-total"><div class="stat"><strong id="weekProgress">0%</strong>Heildarframvinda</div><div class="stat"><strong id="coreDone">0 af 20</strong>Kjarnaatriði</div><div class="stat"><strong id="wrongTotal">0</strong>Rangar tilraunir</div></div><p><strong>Valfrjáls C-verkefni og meiri æfing hafa ekki áhrif á framvindu.</strong></p></div></section></div>`}
    document.getElementById('tabs').innerHTML=tabs.map(([id,name])=>`<button class="tab" id="tab-${id}" type="button" role="tab" aria-controls="panel-${id}" aria-selected="false" data-tab="${id}" ${disabledTabs.has(id)?'disabled aria-disabled="true" title="Efni dagsins verður opnað síðar."':''}>${name}</button>`).join('');

    document.querySelectorAll('.panel').forEach(p=>{const id=p.id.slice(6);p.setAttribute('role','tabpanel');p.setAttribute('aria-labelledby','tab-'+id);p.tabIndex=0});
    function math(){if(window.MathJax?.typesetPromise)window.MathJax.typesetPromise().catch(()=>{})}
    function renderQuiz(id){const item=q[id],s=task(item.day,id),wrap=document.querySelector(`[data-quiz="${id}"]`);if(!wrap)return;wrap.querySelectorAll('[data-choice]').forEach(btn=>{const val=Number(btn.dataset.choice);btn.classList.remove('selected','correct','incorrect');if(val===s.answer)btn.classList.add(s.status==='completed'?'correct':'incorrect');btn.disabled=s.status==='completed';btn.setAttribute('aria-pressed',String(val===s.answer))});const fb=wrap.querySelector(`[data-feedback="${id}"]`),at=wrap.querySelector(`[data-attempt="${id}"]`);if(s.status==='completed'){fb.className='feedback show good';fb.innerHTML='✓ '+item.ok}else if(s.answer){const hint=Array.isArray(item.hint)?item.hint[s.answer-1]:item.hint;fb.className='feedback show bad';fb.innerHTML='× '+hint+' Reyndu aftur.'}else{fb.className='feedback';fb.textContent=''}at.hidden=!s.attempts;at.textContent=s.attempts?'Rangar tilraunir: '+s.attempts:''}
    function renderInput(id){const d=inputTasks[id],s=task(d.day,id),card=document.querySelector(`[data-input-card="${id}"]`);if(!card)return;(s.inputs||[]).forEach((v,i)=>{const el=card.querySelector(`[data-input-index="${i}"]`);if(el&&el.value!==String(v))el.value=v});card.querySelectorAll('[data-input-index]').forEach((el,i)=>{el.classList.remove('correct','incorrect');if(s.checked)el.classList.add(nearly(parseValue(el.value),d.expected[i])?'correct':'incorrect');el.disabled=s.status==='completed'});const note=card.querySelector(`[data-note-task="${id}"]`);if(note){if(note.value!==String(s.note||''))note.value=s.note||'';note.disabled=s.status==='completed'}const fb=card.querySelector(`[data-input-feedback="${id}"]`),at=card.querySelector(`[data-input-attempt="${id}"]`);if(s.status==='completed'){fb.className='feedback show good';fb.innerHTML='✓ '+d.ok}else if(s.checked){fb.className='feedback show bad';fb.textContent='× Ekki rétt. '+d.hint+' Reyndu aftur.'}else{fb.className='feedback';fb.textContent=''}at.hidden=!s.attempts;at.textContent=s.attempts?'Rangar tilraunir: '+s.attempts:''}
    function renderReason(id){const d=reasonTasks[id],s=task(d.day,id),card=document.querySelector(`[data-reason-card="${id}"]`);if(!card)return;const area=card.querySelector(`[data-reason-task="${id}"]`),fb=card.querySelector(`[data-reason-feedback="${id}"]`);if(area&&area.value!==String(s.response||''))area.value=s.response||'';if(area)area.disabled=s.status==='completed';if(s.status==='completed'){fb.className='feedback show good';fb.textContent='✓ '+d.ok}else if(s.checked){fb.className='feedback show bad';fb.textContent='× '+d.hint}else{fb.className='feedback';fb.textContent=''}}
    function renderMatch(id){const d=matchTasks[id],s=task(d.day,id),card=document.querySelector(`[data-match-card="${id}"]`);if(!card)return;card.querySelectorAll('[data-match-index]').forEach((el,i)=>{el.classList.remove('correct','incorrect');if(s.checked)el.classList.add(Number(el.value)===d.expected[i]?'correct':'incorrect');el.disabled=s.status==='completed'});const fb=card.querySelector(`[data-match-feedback="${id}"]`),at=card.querySelector(`[data-match-attempt="${id}"]`);if(s.status==='completed'){fb.className='feedback show good';fb.innerHTML='✓ '+d.ok}else if(s.checked){fb.className='feedback show bad';fb.textContent='× Ekki rétt. '+d.hint+' Reyndu aftur.'}else{fb.className='feedback';fb.textContent=''}at.hidden=!s.attempts;at.textContent=s.attempts?'Rangar tilraunir: '+s.attempts:''}
    function syncChoiceGroup(day,prefix,count){const d=dayState(day),ids=Array.from({length:count},(_,i)=>`${prefix}_${i+1}`),answers=ids.map(id=>d[id]?.answer||null),attempts=ids.reduce((n,id)=>n+(Number(d[id]?.attempts)||0),0);d[prefix]={status:ids.every(id=>d[id]?.status==='completed')?'completed':'pending',answers,attempts}}
    document.addEventListener('click',e=>{const choice=e.target.closest('[data-choice]');if(choice){const id=choice.dataset.task,item=q[id],s=task(item.day,id);if(s.status==='completed')return;s.answer=Number(choice.dataset.choice);if(s.answer===item.correct)s.status='completed';else s.attempts=(s.attempts||0)+1;if(id.startsWith('MID_A1_'))syncChoiceGroup('wednesday','MID_A1',3);if(id.startsWith('MID6_A_'))syncChoiceGroup('wednesday','MID6_A',3);if(id.startsWith('FIM_A1_'))syncChoiceGroup('thursday','FIM_A1',2);if(id.startsWith('FOS62_EXIT_'))syncChoiceGroup('friday','FOS62_EXIT',2);if(id.startsWith('FOS63_READ_'))syncChoiceGroup('friday','FOS63_READ',4);if(id.startsWith('FOS66_READ_'))syncChoiceGroup('friday','FOS66_READ',4);if(id.startsWith('FOS67_READ_'))syncChoiceGroup('friday','FOS67_READ',4);if(id.startsWith('FOS65_EXIT_'))syncChoiceGroup('friday','FOS65_EXIT',2);save();renderQuiz(id);update();math();return}const ci=e.target.closest('[data-check-input]');if(ci){const id=ci.dataset.checkInput,d=inputTasks[id],s=task(d.day,id),els=[...document.querySelectorAll(`[data-input-task="${id}"]`)];s.inputs=els.map(x=>x.value);s.checked=true;const noteOk=!d.requireNote||String(s.note||'').trim().length>=8;if(s.inputs.every((v,i)=>nearly(parseValue(v),d.expected[i]))&&noteOk)s.status='completed';else s.attempts=(s.attempts||0)+1;if(id.startsWith('FOS6_A_'))syncChoiceGroup('friday','FOS6_A',2);save();renderInput(id);update();math();return}const cm=e.target.closest('[data-check-match]');if(cm){const id=cm.dataset.checkMatch,d=matchTasks[id],s=task(d.day,id),els=[...document.querySelectorAll(`[data-match-task="${id}"]`)];s.pairs=els.map(x=>Number(x.value)||0);s.checked=true;if(s.pairs.every((v,i)=>v===d.expected[i]))s.status='completed';else s.attempts=(s.attempts||0)+1;save();renderMatch(id);update();math();return}const cr=e.target.closest('[data-check-reason]');if(cr){const id=cr.dataset.checkReason,d=reasonTasks[id],s=task(d.day,id);s.checked=true;if(String(s.response||'').trim().length>=d.minLength)s.status='completed';if(id.startsWith('FOS62_EXIT_'))syncChoiceGroup('friday','FOS62_EXIT',2);save();renderReason(id);update();return}const ba=e.target.closest('[data-book-answer]');if(ba){const id=ba.dataset.bookAnswer,s=task('friday',id);if(!s.checked)return;s.answerRevealed=!s.answerRevealed;save();const box=document.querySelector(`[data-book-model="${id}"]`);box.hidden=!s.answerRevealed;ba.textContent=s.answerRevealed?'Fela svar':'Sýna svar';math();return}const rev=e.target.closest('[data-reveal]');if(rev){const s=task(rev.dataset.day,rev.dataset.reveal);s.revealed=!s.revealed;save();const box=document.querySelector(`[data-model="${rev.dataset.reveal}"]`);box.hidden=!s.revealed;rev.textContent=s.revealed?'Fela fyrirmyndarsvar':'Sýna fyrirmyndarsvar';math()}});
    document.addEventListener('input',e=>{if(e.target.matches('[data-input-task]')){const id=e.target.dataset.inputTask,d=inputTasks[id],s=task(d.day,id);s.inputs=s.inputs||[];s.inputs[Number(e.target.dataset.inputIndex)]=e.target.value;s.checked=false;save();renderInput(id)}if(e.target.matches('[data-note-task]')){const id=e.target.dataset.noteTask,s=task(inputTasks[id].day,id);s.note=e.target.value;s.checked=false;save();renderInput(id)}if(e.target.matches('[data-reason-task]')){const id=e.target.dataset.reasonTask,s=task(reasonTasks[id].day,id);s.response=e.target.value;s.checked=false;save();renderReason(id)}});
    document.addEventListener('change',e=>{if(e.target.matches('[data-match-task]')){const id=e.target.dataset.matchTask,d=matchTasks[id],s=task(d.day,id);s.pairs=s.pairs||[];s.pairs[Number(e.target.dataset.matchIndex)]=Number(e.target.value)||0;s.checked=false;save();renderMatch(id)}if(e.target.matches('[data-core-check],[data-self-check]')){const id=e.target.dataset.coreCheck||e.target.dataset.selfCheck,s=task(e.target.dataset.day,id);s.checked=e.target.checked;s.status=s.checked?'completed':'pending';if(!s.checked)s.answerRevealed=false;const button=document.querySelector(`[data-book-answer="${id}"]`),box=document.querySelector(`[data-book-model="${id}"]`);if(button){button.disabled=!s.checked;button.textContent='Sýna svar'}if(box)box.hidden=true;save();update()}if(e.target.matches('[data-extra-check]')){const s=task(e.target.dataset.day,e.target.dataset.extraCheck);s.extra_checked=e.target.checked;save()}});
    function dayCount(day){const ids=core[day];return{done:ids.filter(id=>isComplete(day,id)).length,total:ids.length}}
    function wrongFor(day){if(day==='friday'){const ids=new Set(['FOS67_READ_1','FOS67_READ_2','FOS67_READ_3','FOS67_READ_4','FOS65_BINOM','FOS65_EXIT_1','FOS65_EXIT_2']);return Object.entries(dayState(day)).reduce((n,[id,x])=>n+(ids.has(id)?Number(x.attempts)||0:0),0)}return Object.entries(dayState(day)).reduce((n,[id,x])=>n+(['MID_A1','MID6_A','FIM_A1','FOS6_A','FOS62_EXIT'].includes(id)?0:(Number(x.attempts)||0)),0)}
    function updateLocks(){document.querySelectorAll('article.quiz-card').forEach(card=>{const parts=[...card.querySelectorAll('.part-question[data-quiz]')];parts.forEach((part,i)=>{part.hidden=i>0&&task(q[parts[i-1].dataset.quiz].day,parts[i-1].dataset.quiz).status!=='completed'})})}
    function update(){updateLocks();const p=progress();state.progress={completedCoreTasks:p.done,totalCoreTasks:p.total,percent:p.percent};const active=document.querySelector('.tab.active')?.dataset.tab||state.activeTab;const shown=core[active]?dayCount(active):p;document.getElementById('progressBar').style.width=(core[active]?Math.round(shown.done/shown.total*100):p.percent)+'%';document.getElementById('progressTrack').setAttribute('aria-valuenow',String(core[active]?Math.round(shown.done/shown.total*100):p.percent));document.getElementById('progressLabel').textContent=core[active]?`${shown.done} af ${shown.total} kjarnaatriðum dagsins lokið`:`${p.done} af ${p.total} kjarnaatriðum lokið`;Object.keys(core).forEach(day=>document.querySelector(`[data-day-complete="${day}"]`)?.classList.toggle('show',dayCount(day).done===dayCount(day).total));const grid=document.getElementById('weekGrid');if(grid){grid.innerHTML='<div class="week-cell week-head">Dagur</div><div class="week-cell week-head">Lokið</div><div class="week-cell week-head">Staða</div><div class="week-cell week-head">Rangar</div>'+Object.keys(core).map(day=>{const c=dayCount(day);return `<div class="week-cell"><strong>${dayNames[day]}</strong></div><div class="week-cell">${c.done}/${c.total}</div><div class="week-cell">${c.done===c.total?'✓ Lokið':'○ Ólokið'}</div><div class="week-cell">${wrongFor(day)}</div>`}).join('');document.getElementById('weekProgress').textContent=p.percent+'%';document.getElementById('coreDone').textContent=`${p.done} af ${p.total}`;document.getElementById('wrongTotal').textContent=Object.keys(core).reduce((n,d)=>n+wrongFor(d),0)}}
    function switchTab(id,focus=false){if(disabledTabs.has(id))return;state.activeTab=id;document.querySelectorAll('.tab').forEach(t=>{const on=t.dataset.tab===id;t.classList.toggle('active',on);t.setAttribute('aria-selected',String(on));t.tabIndex=on?0:-1});document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+id));save();update();if(focus)document.getElementById('panel-'+id)?.focus();math()}
    const enabledTabs=tabs.filter(([id])=>!disabledTabs.has(id));
    document.querySelectorAll('.tab:not(:disabled)').forEach(tab=>{tab.addEventListener('click',()=>switchTab(tab.dataset.tab,true));tab.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const i=enabledTabs.findIndex(([id])=>id===tab.dataset.tab);const n=e.key==='Home'?0:e.key==='End'?enabledTabs.length-1:e.key==='ArrowRight'?(i+1)%enabledTabs.length:(i-1+enabledTabs.length)%enabledTabs.length;document.getElementById('tab-'+enabledTabs[n][0]).focus();switchTab(enabledTabs[n][0])})});
    Object.keys(q).forEach(renderQuiz);Object.keys(inputTasks).forEach(renderInput);Object.keys(matchTasks).forEach(renderMatch);Object.keys(reasonTasks).forEach(renderReason);switchTab(tabs.some(x=>x[0]===state.activeTab)&&!disabledTabs.has(state.activeTab)?state.activeTab:'tuesday');update();math();
    window.__VIKA6_TEST__={state,core,q,inputTasks,matchTasks,parseValue,nearly,progress,dayCount,isComplete,save};
