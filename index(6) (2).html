  <script>
  (()=>{
    'use strict';
    const STORE='STAER3TO05_VIKA6_v1';
    const tabs=[['tuesday','Þriðjudagur'],['wednesday','Miðvikudagur'],['thursday','Fimmtudagur'],['friday','Föstudagur'],['weekly','Vikuskil']];

    const core={tuesday:['TRI_A1','TRI_A2','TRI_A3','TRI_B','TRI_LOK'],wednesday:['MID_A1','MID_A2','MID_A3','MID_B','MID_LOK'],thursday:['FIM_A1','FIM_A2','FIM_A3','FIM_B','FIM_LOK'],friday:['FOS_A1','FOS_A2','FOS_B','FOS_LOK']};
    const initial=()=>({version:'1.0',lastUpdated:'',activeTab:'tuesday',progress:{completedCoreTasks:0,totalCoreTasks:19,percent:0},days:{thridjudagur:{},midvikudagur:{},fimmtudagur:{},fostudagur:{}}});
    function load(){try{const raw=JSON.parse(localStorage.getItem(STORE));const base=initial();if(!raw||typeof raw!=='object')return base;return{...base,...raw,progress:{...base.progress,...(raw.progress||{})},days:{thridjudagur:{...(raw.days?.thridjudagur||{})},midvikudagur:{...(raw.days?.midvikudagur||{})},fimmtudagur:{...(raw.days?.fimmtudagur||{})},fostudagur:{...(raw.days?.fostudagur||{})}}}}catch{return initial()}}
    const state=load();
    const dayState=day=>state.days[dayMap[day]];
    const task=(day,id)=>dayState(day)[id]||(dayState(day)[id]={status:'pending',attempts:0});
    function isComplete(day,id){const groups={TRI_A1:['TRI_A1_1','TRI_A1_2','TRI_A1_3','TRI_A1_4'],MID_A1:['MID_A1_1','MID_A1_2','MID_A1_3'],FIM_A1:['FIM_A1_1','FIM_A1_2']};if(groups[id])return groups[id].every(x=>task(day,x).status==='completed');return task(day,id).status==='completed'}
    function progress(){let done=0,total=0;Object.entries(core).forEach(([day,ids])=>{total+=ids.length;done+=ids.filter(id=>isComplete(day,id)).length});return{done,total,percent:total?Math.round(done/total*100):0}}
    function save(){const p=progress();state.progress={completedCoreTasks:p.done,totalCoreTasks:p.total,percent:p.percent};state.lastUpdated=new Date().toISOString();localStorage.setItem(STORE,JSON.stringify(state))}
    const q={};
    function addQuiz(day,id,question,options,correct,ok,hint){q[id]={day,id,question,options,correct,ok,hint};return q[id]}
    addQuiz('tuesday','TRI_A1_1','Teningi er kastað einu sinni. Hverjar eru líkurnar á að fá 1 eða 6?',['Samlagningsregla (sundurlægir atburðir): \\(P(1 \\text{ eða } 6)=P(1)+P(6)\\)','Margföldunarregla: \\(P(1 \\text{ og } 6)=P(1)\\cdot P(6)\\)'],1,'Rétt! Atburðirnir geta ekki gerst samtímis. Við leggjum saman: \\(\\frac16+\\frac16=\\frac13\\).','Teningnum er kastað einu sinni. Getur sama kast skilað bæði 1 og 6?');
    addQuiz('tuesday','TRI_A1_2','Teningi er kastað tvisvar. Hverjar eru líkurnar á að fá 6 í fyrra kastinu og 6 í seinna kastinu?',['Samlagningsregla: \\(P(6)+P(6)\\)','Margföldunarregla: \\(P(6)\\cdot P(6)\\)'],2,'Rétt! Þetta eru tveir sjálfstæðir atburðir í röð: \\(\\frac16\\cdot\\frac16=\\frac1{36}\\).','Tilraunin samanstendur af tveimur köstum í röð og spurt er um fyrra og seinna kastið.');
    addQuiz('tuesday','TRI_A1_3','Spil er dregið úr 52 spila stokki og því skilað aftur. Síðan er annað spil dregið. Hverjar eru líkurnar á að fá gosa í bæði skiptin?',['Samlagningsregla: \\(P(\\text{gosi})+P(\\text{gosi})\\)','Margföldunarregla: \\(P(\\text{gosi})\\cdot P(\\text{gosi})\\)'],2,'Rétt! Drættirnir eru óháðir: \\(\\frac4{52}\\cdot\\frac4{52}=\\frac1{169}\\).','Tveir drættir eiga sér stað í röð. Spilinu er skilað og fjöldinn breytist því ekki.');
    addQuiz('tuesday','TRI_A1_4','Í poka eru 3 gular og 5 bláar kúlur. Dregnar eru tvær kúlur án skila. Hverjar eru líkurnar á að fá fyrst gula og síðan bláa?',['Margföldun háðra líkinda: \\(P(G_1)\\cdot P(B_2\\mid G_1)\\)','Samlagning líkinda: \\(P(G_1)+P(B_2)\\)'],1,'Rétt! Eftir fyrri drátt eru 7 kúlur eftir: \\(\\frac38\\cdot\\frac57=\\frac{15}{56}\\).','Þetta eru tvö skref í röð. Athugaðu hve margar kúlur eru eftir í seinni drætti.');
    addQuiz('tuesday','TRI_A3','Jón leggur saman \\(\\frac16+\\frac16\\) til að finna líkurnar á a.m.k. einum sexa í tveimur köstum. Hvers vegna er það rangt?',['Hann gleymdi að margfalda brotin.','Atburðirnir eru ekki sundurlægir; útkoman \\((6,6)\\) er tvítalin.','Hann átti að deila með 2.'],2,'Rétt! Atburðirnir skarast í útkomunni \\((6,6)\\). Réttar líkur eru \\(\\frac{11}{36}\\), ekki \\(\\frac{12}{36}\\).','Skoðaðu útkomuna þar sem sexa kemur upp í báðum köstum.');
    addQuiz('tuesday','TRI_LOK','Spil er dregið tvisvar úr 52 spila stokki án skila. Hvaða uppsetning gefur líkurnar á tveimur hjörtum?',['\\(\\frac{13}{52}\\cdot\\frac{13}{52}\\)','\\(\\frac{13}{52}+\\frac{12}{51}\\)','\\(\\frac{13}{52}\\cdot\\frac{12}{51}\\)','\\(\\frac{13}{52}\\cdot\\frac{13}{51}\\)'],3,'Rétt! Í seinna drætti eru 12 hjörtu eftir af 51 spili.','Tveir drættir eru í röð og dregið er án skila.');
    const midA1=[
      addQuiz('wednesday','MID_A1_1','Óskekktri krónu er kastað. Árangur er þorskur.',['\\(p=0{,}5,\\ q=0{,}5\\)','\\(p=\\frac16,\\ q=\\frac56\\)','\\(p=0{,}2,\\ q=0{,}8\\)'],1,'Rétt! Hér eru báðar útkomur jafnlíklegar.','Notaðu \\(q=1-p\\).'),
      addQuiz('wednesday','MID_A1_2','Sexhliða teningi er kastað. Árangur er að fá sexa.',['\\(p=0{,}5,\\ q=0{,}5\\)','\\(p=\\frac16,\\ q=\\frac56\\)','\\(p=\\frac56,\\ q=\\frac16\\)'],2,'Rétt! Ein hlið af sex gefur árangur.','Líkurnar á sexa eru ein hagstæð útkoma af sex.'),
      addQuiz('wednesday','MID_A1_3','Giskað er á krossapróf með 5 valmöguleikum. Árangur er rétt svar.',['\\(p=0{,}2,\\ q=0{,}8\\)','\\(p=0{,}5,\\ q=0{,}5\\)','\\(p=0{,}8,\\ q=0{,}2\\)'],1,'Rétt! Einn af fimm valmöguleikum er réttur.','Reiknaðu \\(1/5\\) og notaðu síðan \\(q=1-p\\).')
    ];
    addQuiz('wednesday','MID_A3','Skoðaðu stöplaritið fyrir \\(N=4\\) krónuköst á bls. 138. Hver er hæð stöpulsins fyrir \\(X=2\\), og hvers vegna er hann hæstur?',['\\(0{,}2500\\), því 2 er helmingurinn af 4.','\\(0{,}3750\\), því 6 af 16 röðum gefa nákvæmlega 2 þorska.','\\(0{,}5000\\), því líkurnar á þorski eru 0,5.'],2,'Rétt! Sex af 16 jafnlíklegum röðum gefa tvo þorska: \\(\\frac6{16}=0{,}3750\\).','Teldu raðirnar með nákvæmlega tvo þorska af 16 mögulegum röðum.');
    const fimA1=[
      addQuiz('thursday','FIM_A1_1','Krónu er kastað 10 sinnum og fjöldi þorska mældur. Er þetta tvíliðatilraun?',['Já.','Nei.'],1,'Rétt! \\(n=10\\), tvær útkomur og föst \\(p=0{,}5\\).','Athugaðu fjölda tilrauna, fjölda mögulegra útkomna og hvort p haldist fast.'),
      addQuiz('thursday','FIM_A1_2','Dregnar eru 4 kúlur úr krukku án skila. Er þetta tvíliðatilraun?',['Já.','Nei.'],2,'Rétt! Án skila breytist \\(p\\) milli drátta og tilraunirnar eru háðar.','Spyrðu hvort líkurnar haldist óbreyttar eftir hvern drátt.')
    ];
    addQuiz('thursday','FIM_LOK','Hvaða uppsetning gefur líkurnar á nákvæmlega 4 þorskum í 10 krónuköstum?',['\\(P=\\binom{10}{4}(0{,}5)^4(0{,}5)^6\\)','\\(P=\\binom4{10}(0{,}5)^{10}(0{,}5)^4\\)','\\(P=10\\cdot(0{,}5)^4\\)','\\(P=\\binom{10}{4}(0{,}4)^5(0{,}6)^5\\)'],1,'Rétt! Hér er \\(n=10\\), \\(k=4\\), \\(n-k=6\\) og \\(p=q=0{,}5\\).','Notaðu n=10 og k=4; þá er n−k=6.');
    addQuiz('friday','FOS_A2','Í flugskeytadæmi er \\(n=5\\). Hvaða líkindi þarf að leggja saman fyrir „a.m.k. 3 hæfa“?',['Aðeins \\(P(k=3)\\).','\\(P(k=3)+P(k=4)+P(k=5)\\).','\\(P(k=1)+P(k=2)+P(k=3)\\).'],2,'Rétt! „A.m.k. 3“ nær yfir 3, 4 og 5.','A.m.k. 3 merkir 3 eða hærra.');
    addQuiz('friday','FOS_LOK','Dæmi spyr um líkurnar á a.m.k. 4 sexum í 6 teningaköstum. Hvaða skref þarf?',['Reikna aðeins \\(P(k=4)\\).','Reikna \\(P(k=4)\\), \\(P(k=5)\\) og \\(P(k=6)\\) og leggja saman.','Reikna \\(P(k=1)+P(k=2)+P(k=3)+P(k=4)\\).','Margfalda \\(P(k=4)P(k=5)P(k=6)\\).'],2,'Rétt! „A.m.k. 4“ felur í sér 4, 5 og 6 árangra.','Skráðu öll möguleg k-gildi sem eru 4 eða hærri.');
    const inputTasks={
      TRI_A2:{day:'tuesday',labels:['G í 1. drætti','B í 1. drætti','G í 2. drætti ef fyrri var G','B í 2. drætti ef fyrri var G','G í 2. drætti ef fyrri var B','B í 2. drætti ef fyrri var B'],expected:[3/8,5/8,2/7,5/7,3/7,4/7],ok:'Rétt! Eftir fyrsta drátt eru 7 kúlur eftir. Summa greina úr sama hnúti er alltaf 1.',hint:'Eftir gula kúlu eru 2 gular og 5 bláar eftir; eftir bláa eru 3 gular og 4 bláar eftir.'},
      MID_A2:{day:'wednesday',labels:['X=0: fjöldi raða','X=0: P(X)','X=1: fjöldi raða','X=1: P(X)','X=2: fjöldi raða','X=2: P(X)','X=3: fjöldi raða','X=3: P(X)'],expected:[1,1/8,3,3/8,3,3/8,1,1/8],ok:'Rétt! Dreifingin er 1, 3, 3, 1 röð og líkurnar leggja saman í 1.',hint:'Það eru 8 jafnlíklegar raðir. Deildu fjölda raða í hverjum flokki með 8.'},
      MID_LOK:{day:'wednesday',labels:['P(X=2)'],expected:[0.3],ok:'Rétt! \\(1-(0{,}10+0{,}40+0{,}20)=0{,}30\\).',hint:'Líkurnar í dreifingunni verða samtals 1.'},
      FIM_A3:{day:'thursday',labels:['n','k','p','q'],expected:[6,3,1/3,2/3],ok:'Rétt! \\(n=6\\), \\(k=3\\), \\(p=1/3\\) og \\(q=2/3\\). Notaðu þessi gildi nú í útreikningnum á blaði.',hint:'Það eru 6 spurningar, beðið er um 3 réttar og einn af 3 valmöguleikum er réttur.'}
    };
    const matchTasks={
      FIM_A2:{day:'thursday',terms:['\\(\\binom nk\\)','\\(p^k\\)','\\(q^{n-k}\\)'],choices:['Fjöldi raða sem gefa k árangra.','Líkur á k árangrum í tiltekinni röð.','Líkur á n−k tilvikum án árangurs.'],expected:[1,2,3],ok:'Rétt! Formúlan tengir fjölda mögulegra raða við líkurnar á einni slíkri röð.',hint:'Aðgreindu fjölda leiða frá líkunum í einni röð.'},
      FOS_A1:{day:'friday',terms:['A.m.k. 3','Í mesta lagi 2','Fleiri en 3','Aðeins 2'],choices:['k ∈ {3, 4, 5}','k ∈ {0, 1, 2}','k ∈ {4, 5}','k = 2'],expected:[1,2,3,4],ok:'Rétt! Þú hefur þýtt orðalagið yfir í rétt mengi k-gilda.',hint:'A.m.k. merkir gildið eða hærra; í mesta lagi merkir gildið eða lægra.'}
    };
    function esc(v){return String(v??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
    function parseValue(raw){let s=String(raw??'').trim().replace(/\s/g,'').replace(',','.');if(!s)return NaN;if(s.endsWith('%'))return Number(s.slice(0,-1))/100;if(/^[-+]?\d+(?:\.\d+)?\/[-+]?\d+(?:\.\d+)?$/.test(s)){const[a,b]=s.split('/').map(Number);return b?a/b:NaN}return Number(s)}
    function nearly(a,b){return Number.isFinite(a)&&Math.abs(a-b)<=0.0011}
    function quizPart(item){return `<div class="part-question" data-quiz="${item.id}"><p>${item.question}</p><div class="options">${item.options.map((o,i)=>`<button class="option" type="button" data-choice="${i+1}" data-task="${item.id}">${o}</button>`).join('')}</div><div class="feedback" data-feedback="${item.id}" role="status" aria-live="polite"></div><p class="attempt-count" data-attempt="${item.id}" hidden></p></div>`}
    function quizCard(label,title,items,tag='Gagnvirk leiðsögn'){return `<article class="card quiz-card"><div class="card-top"><span class="number">${label}</span><span class="card-tag">${tag}</span></div><h3>${title}</h3>${items.map(quizPart).join('')}</article>`}
    function inputCard(id,label,title,intro,table=false){const d=inputTasks[id],s=task(d.day,id),vals=s.inputs||[];let fields=d.labels.map((x,i)=>`<label class="input-field"><span>${x}</span><input class="answer-input" inputmode="decimal" autocomplete="off" data-input-task="${id}" data-input-index="${i}" value="${esc(vals[i])}" aria-label="${esc(x)}"></label>`).join('');if(table&&id==='MID_A2'){const rows=[['0','BBB',0,1],['1','ÞBB, BÞB, BBÞ',2,3],['2','ÞÞB, ÞBÞ, BÞÞ',4,5],['3','ÞÞÞ',6,7]];fields=`<div class="distribution-wrap"><table class="distribution-table"><thead><tr><th>X</th><th>Mögulegar raðir</th><th>Fjöldi raða</th><th>P(X)</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td><input class="answer-input" inputmode="decimal" data-input-task="${id}" data-input-index="${r[2]}" value="${esc(vals[r[2]])}" aria-label="X ${r[0]}, fjöldi raða"></td><td><input class="answer-input" inputmode="decimal" data-input-task="${id}" data-input-index="${r[3]}" value="${esc(vals[r[3]])}" aria-label="X ${r[0]}, líkur"></td></tr>`).join('')}</tbody></table></div>`}else fields=`<div class="input-grid">${fields}</div>`;return `<article class="card quiz-card" data-input-card="${id}"><div class="card-top"><span class="number">${label}</span><span class="card-tag">Gagnvirk leiðsögn</span></div><h3>${title}</h3><p>${intro}</p>${fields}<button class="primary check-button" type="button" data-check-input="${id}">Athuga</button><div class="feedback" data-input-feedback="${id}" role="status" aria-live="polite"></div><p class="attempt-count" data-input-attempt="${id}" hidden></p></article>`}
    function matchCard(id,label,title,intro){const d=matchTasks[id],s=task(d.day,id),pairs=s.pairs||[];return `<article class="card quiz-card" data-match-card="${id}"><div class="card-top"><span class="number">${label}</span><span class="card-tag">Pörun</span></div><h3>${title}</h3><p>${intro}</p><div class="matching-grid">${d.terms.map((term,i)=>`<label class="matching-row"><span class="matching-term">${term}</span><select class="match-select" data-match-task="${id}" data-match-index="${i}"><option value="">Veldu</option>${d.choices.map((c,j)=>`<option value="${j+1}" ${pairs[i]===j+1?'selected':''}>${c}</option>`).join('')}</select></label>`).join('')}</div><button class="primary check-button" type="button" data-check-match="${id}">Athuga</button><div class="feedback" data-match-feedback="${id}" role="status" aria-live="polite"></div><p class="attempt-count" data-match-attempt="${id}" hidden></p></article>`}
    function bCard(day,id,label,title,body,extra=false){const s=task(day,id);return `<article class="card book-task"><div class="card-top"><span class="number">${label}</span><span class="card-tag">Sjálfstæð vinna á blaði</span></div><h3>${title}</h3><div class="task-body">${body}</div><div class="check-stack"><label class="task-check"><input type="checkbox" data-core-check="${id}" data-day="${day}" ${s.checked?'checked':''}><span>${extra?'Ég hef leyst kjarnadæmin 5a–c og 7a–b á blaði.':'Ég hef lokið verkefninu og varðveiti vinnuna.'}</span></label>${extra?`<label class="task-check"><input type="checkbox" data-extra-check="FOS_B" data-day="friday" ${s.extra_checked?'checked':''}><span>(Valfrjálst) Ég hef leyst aukadæmin 11b–d á blaði.</span></label>`:''}</div></article>`}
    function selfCard(day,id,title,question,model){const s=task(day,id);return `<article class="card optional-card" data-self-card="${id}"><div class="card-top"><span class="number">C</span><span class="card-tag">Valfrjáls túlkun og rökstuðningur</span></div><h3>${title}</h3><p>${question}</p><button class="secondary" type="button" data-reveal="${id}" data-day="${day}">${s.revealed?'Fela fyrirmyndarsvar':'Sýna fyrirmyndarsvar'}</button><div class="model-answer" data-model="${id}" ${s.revealed?'':'hidden'}><p><strong>Fyrirmyndarsvar:</strong> ${model}</p></div><label class="task-check"><input type="checkbox" data-self-check="${id}" data-day="${day}" ${s.checked?'checked':''}><span>Ég hef borið saman eigið svar og fyrirmyndarsvarið.</span></label></article>`}
    function sectionLabel(letter,title,intro=''){return `<section><p class="section-kicker part-label">${letter}-hluti</p><h2>${title}</h2>${intro?`<p class="section-intro">${intro}</p>`:''}`}
    function dayIntro(day,topic,goals,links){return `<section><p class="section-kicker">${dayNames[day]} · Vika 6</p><h2>${topic}</h2><div class="day-goals"><strong>Námsmarkmið dagsins</strong><ul>${goals.map(x=>`<li>${x}</li>`).join('')}</ul></div>${links.map(x=>`<a class="secondary" href="${x[0]}" target="_blank" rel="noopener noreferrer">${x[1]}</a>`).join(' ')}</section>`}
    function tuesday(){return `<div class="panel" id="panel-tuesday">${dayIntro('tuesday','Líkindareglur og líkindatré',['velja samlagningu fyrir sundurlæga atburði og margföldun fyrir atburði í röð;','fylla út líkindatré án skila;','greina skörun og tvítalningu.'],[['Líkindi.pdf','Opna Líkindi.pdf']])}${sectionLabel('A','Gagnvirk leiðsögn','Byrjaðu á að greina aðstæðurnar. Reiknaðu síðan og athugaðu skilninginn.')}${quizCard('A1','Hvaða regla á við?',[q.TRI_A1_1,q.TRI_A1_2,q.TRI_A1_3,q.TRI_A1_4])}${inputCard('TRI_A2','A2','Fylltu út líkindatréð','Í poka eru 3 gular og 5 bláar kúlur. Tvær eru dregnar án skila. Skráðu líkur á hverri grein.')}${quizCard('A3','Villugreining',[q.TRI_A3])}</section>${sectionLabel('B','Sjálfstæð vinna')}${bCard('tuesday','TRI_B','B','Dæmi 5, 7 og 8',`<p class="book-reference">Æfing 9.1 · bls. 137–138</p><p>Leystu dæmi 5, 7 og 8 í stílabókina. Teiknaðu líkindatré þar sem það á við.</p>`)}</section>${sectionLabel('C','Túlkun og rökstuðningur')}${selfCard('tuesday','TRI_C','Af hverju verður summan 1?','Líkindatré greinist út frá einum hnúti. Hvers vegna er summa líkinda á öllum greinum frá sama hnúti alltaf 1? Skrifaðu 1–2 setningar á blað.','Greinarnar ná yfir allar mögulegar næstu útkomur. Ein þeirra verður að gerast og þær útiloka hver aðra, svo samanlögð líkindi eru 1.')}</section>${sectionLabel('Lok','Stöðumat dagsins')}${quizCard('Lok','Tvö hjörtu án skila',[q.TRI_LOK],'Leifturpróf')}</section><div class="completion" data-day-complete="tuesday"><strong>Kjarnavinnu þriðjudags er lokið.</strong></div></div>`}
    function wednesday(){return `<div class="panel" id="panel-wednesday">${dayIntro('wednesday','6.1 · Líkindadreifing',['greina p og q;','byggja líkindadreifingartöflu;','túlka stöplarit og sannreyna að summa líkinda sé 1.'],[['tolfræði6.pdf','Opna tolfræði6.pdf']])}${sectionLabel('A','Gagnvirk leiðsögn')}${quizCard('A1','p og q',midA1)}${inputCard('MID_A2','A2','Byggðu líkindadreifingu','Óskekktri krónu er kastað þrisvar. Flokkaðu átta mögulegar raðir eftir fjölda þorska X.',true)}${quizCard('A3','Lestu úr stöplariti',[q.MID_A3])}</section>${sectionLabel('B','Sjálfstæð vinna')}${bCard('wednesday','MID_B','B','Líkindadreifing þriggja barna fjölskyldu',`<p>Settu upp töflu fyrir fjölda stráka \\(X\\in\\{0,1,2,3\\}\\), reiknaðu líkindi hvers gildis og teiknaðu stöplarit á blað. Staðfestu að summa líkinda sé 1.</p>`)}</section>${sectionLabel('C','Túlkun og rökstuðningur')}${selfCard('wednesday','MID_C','Af hverju er miðjan líklegri?','Fyrir fjögur krónuköst er hver stök röð jafnlíkleg. Rökstyddu á blað hvers vegna tveir þorskar eru líklegri en enginn þorskur.','Aðeins ein röð gefur engan þorsk en sex raðir gefa tvo þorska. Líkurnar fyrir flokk fást með því að leggja saman líkur allra raða í flokknum.')}</section>${sectionLabel('Lok','Stöðumat dagsins')}${inputCard('MID_LOK','Lok','Finndu óþekktu líkurnar','Gefið er P(X=0)=0,10, P(X=1)=0,40, P(X=2)=? og P(X=3)=0,20.')}</section><div class="completion" data-day-complete="wednesday"><strong>Kjarnavinnu miðvikudags er lokið.</strong></div></div>`}
    function thursday(){return `<div class="panel" id="panel-thursday">${dayIntro('thursday','6.2 · Tvíliðaformúlan',['greina skilyrði tvíliðatilraunar;','túlka liði formúlunnar;','greina n, k, p og q úr dæmatexta.'],[['tolfræði6.pdf','Opna tolfræði6.pdf']])}${sectionLabel('A','Gagnvirk leiðsögn')}${quizCard('A1','Er þetta tvíliðatilraun?',fimA1)}${matchCard('FIM_A2','A2','Hvað merkja liðirnir?','Tengdu hvern lið við rétta merkingu.')}${inputCard('FIM_A3','A3','Greindu breyturnar','Á krossaprófi eru 6 spurningar og 3 valmöguleikar við hverja. Giskað er á allt. Skráðu gildin fyrir nákvæmlega 3 rétt svör.')}</section>${sectionLabel('B','Sjálfstæð vinna')}${bCard('thursday','FIM_B','B','Dæmi 3a–b, 6 og 10a',`<p class="book-reference">Æfing 6.2 · bls. 142–143</p><p>Leystu dæmi 3a–b, 6 og 10a á blað. Skrifaðu upp \\(n\\), \\(k\\), \\(p\\) og \\(q\\) fyrir hvert dæmi.</p>`)}</section>${sectionLabel('C','Túlkun og rökstuðningur')}${selfCard('thursday','FIM_C','Af hverju má ekki nota formúluna?','Nemandi notar tvíliðaformúluna þegar fjórar kúlur eru dregnar án skila. Hvaða skilyrði formúlunnar er brotið? Skrifaðu svar á blað.','Án skila breytist p eftir hvern drátt. Tilraunirnar eru því háðar, en tvíliðaformúlan krefst óháðra tilrauna með fast p.')}</section>${sectionLabel('Lok','Stöðumat dagsins')}${quizCard('Lok','Nákvæmlega fjórir þorskar',[q.FIM_LOK],'Leifturpróf')}</section><div class="completion" data-day-complete="thursday"><strong>Kjarnavinnu fimmtudags er lokið.</strong></div></div>`}
    function friday(){return `<div class="panel" id="panel-friday">${dayIntro('friday','6.2 · Samsettar líkur',['þýða orðalag yfir í k-gildi;','leggja saman viðeigandi P(k);','beita tvíliðaformúlunni sjálfstætt.'],[['tolfræði6.pdf','Opna tolfræði6.pdf']])}${sectionLabel('A','Gagnvirk leiðsögn')}${matchCard('FOS_A1','A1','Hvaða k-gildi eiga við?','Gefið er n=5. Tengdu hvert orðalag við rétt mengi k-gilda.')}${quizCard('A2','A.m.k. þrjú hæfa',[q.FOS_A2])}</section>${sectionLabel('B','Sjálfstæð vinna')}${bCard('friday','FOS_B','B','Kjarnadæmi og meiri æfing',`<p class="book-reference">Æfing 6.2 · bls. 142–143</p><h4>Kjarnavinna</h4><ul class="core-list"><li><strong>Dæmi 5a–c:</strong> reiknaðu nákvæmlega 1, nákvæmlega 2 og a.m.k. 1 hæft flugskeyti.</li><li><strong>Dæmi 7a–b:</strong> reiknaðu a.m.k. 2 stráka og a.m.k. 3 stráka í fimm barna fjölskyldu.</li></ul><details><summary>Meiri æfing — valfrjálst</summary><div class="details-body"><p><strong>Dæmi 11b–d:</strong> leystu liðina um líftryggingar á blað.</p></div></details>`,true)}</section>${sectionLabel('C','Túlkun og rökstuðningur')}${selfCard('friday','FOS_C','Berðu saman tvö próf','Próf A hefur 6 rétt/rangt spurningar (p=0,5). Próf B hefur 6 spurningar með 5 valmöguleikum (p=0,2). Spáðu hvort prófið gefur meiri líkur á a.m.k. 3 réttum, rökstyddu og reiknaðu á blað.','Próf A gefur meiri líkur. Fyrir próf A er \\(P(X\\ge 3)=0{,}65625\\approx65{,}6\\%\\), en fyrir próf B er \\(P(X\\ge 3)\\approx0{,}0989\\). Munurinn skýrist af hærra \\(p\\)-gildi í prófi A.')}</section>${sectionLabel('Lok','Stöðumat vikunnar')}${quizCard('Lok','A.m.k. fjórar sexur',[q.FOS_LOK],'Leifturpróf')}</section><div class="completion" data-day-complete="friday"><strong>Kjarnavinnu föstudags er lokið.</strong></div></div>`}
    function weekly(){return `<div class="panel" id="panel-weekly"><section><p class="section-kicker">Vika 6 · Yfirlit</p><h2>Vikuskil</h2><p class="section-intro">Yfirlitið tekur aðeins mið af skylduvinnu vikunnar. Valfrjáls C-verkefni og aukadæmi telja ekki.</p><div class="card" id="weekSnapshot"><h3>Framvinduyfirlit · Vika 6</h3><div class="week-grid-wrap"><div class="week-grid" id="weekGrid"></div></div><div class="week-total"><div class="stat"><strong id="weekProgress">0%</strong>Heildarframvinda</div><div class="stat"><strong id="coreDone">0 af 19</strong>Kjarnaatriði</div><div class="stat"><strong id="wrongTotal">0</strong>Rangar tilraunir</div></div><p><strong>Valfrjáls C-verkefni og meiri æfing hafa ekki áhrif á framvindu.</strong></p></div></section></div>`}
    document.getElementById('tabs').innerHTML=tabs.map(([id,name])=>`<button class="tab" id="tab-${id}" type="button" role="tab" aria-controls="panel-${id}" aria-selected="false" data-tab="${id}">${name}</button>`).join('');
    document.getElementById('main').innerHTML=tuesday()+wednesday()+thursday()+friday()+weekly();
    document.querySelectorAll('.panel').forEach(p=>{const id=p.id.slice(6);p.setAttribute('role','tabpanel');p.setAttribute('aria-labelledby','tab-'+id);p.tabIndex=0});
    function math(){if(window.MathJax?.typesetPromise)window.MathJax.typesetPromise().catch(()=>{})}
    function renderQuiz(id){const item=q[id],s=task(item.day,id),wrap=document.querySelector(`[data-quiz="${id}"]`);if(!wrap)return;wrap.querySelectorAll('[data-choice]').forEach(btn=>{const val=Number(btn.dataset.choice);btn.classList.remove('selected','correct','incorrect');if(val===s.answer)btn.classList.add(s.status==='completed'?'correct':'incorrect');btn.disabled=s.status==='completed';btn.setAttribute('aria-pressed',String(val===s.answer))});const fb=wrap.querySelector(`[data-feedback="${id}"]`),at=wrap.querySelector(`[data-attempt="${id}"]`);if(s.status==='completed'){fb.className='feedback show good';fb.innerHTML='✓ '+item.ok}else if(s.answer){fb.className='feedback show bad';fb.innerHTML='× Ekki rétt. '+item.hint+' Reyndu aftur.'}else{fb.className='feedback';fb.textContent=''}at.hidden=!s.attempts;at.textContent=s.attempts?'Rangar tilraunir: '+s.attempts:''}
    function renderInput(id){const d=inputTasks[id],s=task(d.day,id),card=document.querySelector(`[data-input-card="${id}"]`);if(!card)return;(s.inputs||[]).forEach((v,i)=>{const el=card.querySelector(`[data-input-index="${i}"]`);if(el&&el.value!==String(v))el.value=v});card.querySelectorAll('[data-input-index]').forEach((el,i)=>{el.classList.remove('correct','incorrect');if(s.checked)el.classList.add(nearly(parseValue(el.value),d.expected[i])?'correct':'incorrect');el.disabled=s.status==='completed'});const fb=card.querySelector(`[data-input-feedback="${id}"]`),at=card.querySelector(`[data-input-attempt="${id}"]`);if(s.status==='completed'){fb.className='feedback show good';fb.innerHTML='✓ '+d.ok}else if(s.checked){fb.className='feedback show bad';fb.textContent='× Ekki rétt. '+d.hint+' Reyndu aftur.'}else{fb.className='feedback';fb.textContent=''}at.hidden=!s.attempts;at.textContent=s.attempts?'Rangar tilraunir: '+s.attempts:''}
    function renderMatch(id){const d=matchTasks[id],s=task(d.day,id),card=document.querySelector(`[data-match-card="${id}"]`);if(!card)return;card.querySelectorAll('[data-match-index]').forEach((el,i)=>{el.classList.remove('correct','incorrect');if(s.checked)el.classList.add(Number(el.value)===d.expected[i]?'correct':'incorrect');el.disabled=s.status==='completed'});const fb=card.querySelector(`[data-match-feedback="${id}"]`),at=card.querySelector(`[data-match-attempt="${id}"]`);if(s.status==='completed'){fb.className='feedback show good';fb.innerHTML='✓ '+d.ok}else if(s.checked){fb.className='feedback show bad';fb.textContent='× Ekki rétt. '+d.hint+' Reyndu aftur.'}else{fb.className='feedback';fb.textContent=''}at.hidden=!s.attempts;at.textContent=s.attempts?'Rangar tilraunir: '+s.attempts:''}
    function syncChoiceGroup(day,prefix,count){const d=dayState(day),ids=Array.from({length:count},(_,i)=>`${prefix}_${i+1}`),answers=ids.map(id=>d[id]?.answer||null),attempts=ids.reduce((n,id)=>n+(Number(d[id]?.attempts)||0),0);d[prefix]={status:ids.every(id=>d[id]?.status==='completed')?'completed':'pending',answers,attempts}}
    document.addEventListener('click',e=>{const choice=e.target.closest('[data-choice]');if(choice){const id=choice.dataset.task,item=q[id],s=task(item.day,id);if(s.status==='completed')return;s.answer=Number(choice.dataset.choice);if(s.answer===item.correct)s.status='completed';else s.attempts=(s.attempts||0)+1;if(id.startsWith('MID_A1_'))syncChoiceGroup('wednesday','MID_A1',3);if(id.startsWith('FIM_A1_'))syncChoiceGroup('thursday','FIM_A1',2);save();renderQuiz(id);update();math();return}const ci=e.target.closest('[data-check-input]');if(ci){const id=ci.dataset.checkInput,d=inputTasks[id],s=task(d.day,id),els=[...document.querySelectorAll(`[data-input-task="${id}"]`)];s.inputs=els.map(x=>x.value);s.checked=true;if(s.inputs.every((v,i)=>nearly(parseValue(v),d.expected[i])))s.status='completed';else s.attempts=(s.attempts||0)+1;save();renderInput(id);update();math();return}const cm=e.target.closest('[data-check-match]');if(cm){const id=cm.dataset.checkMatch,d=matchTasks[id],s=task(d.day,id),els=[...document.querySelectorAll(`[data-match-task="${id}"]`)];s.pairs=els.map(x=>Number(x.value)||0);s.checked=true;if(s.pairs.every((v,i)=>v===d.expected[i]))s.status='completed';else s.attempts=(s.attempts||0)+1;save();renderMatch(id);update();math();return}const rev=e.target.closest('[data-reveal]');if(rev){const s=task(rev.dataset.day,rev.dataset.reveal);s.revealed=!s.revealed;save();const box=document.querySelector(`[data-model="${rev.dataset.reveal}"]`);box.hidden=!s.revealed;rev.textContent=s.revealed?'Fela fyrirmyndarsvar':'Sýna fyrirmyndarsvar';math()}});
    document.addEventListener('input',e=>{if(e.target.matches('[data-input-task]')){const id=e.target.dataset.inputTask,d=inputTasks[id],s=task(d.day,id);s.inputs=s.inputs||[];s.inputs[Number(e.target.dataset.inputIndex)]=e.target.value;s.checked=false;save();renderInput(id)}});
    document.addEventListener('change',e=>{if(e.target.matches('[data-match-task]')){const id=e.target.dataset.matchTask,d=matchTasks[id],s=task(d.day,id);s.pairs=s.pairs||[];s.pairs[Number(e.target.dataset.matchIndex)]=Number(e.target.value)||0;s.checked=false;save();renderMatch(id)}if(e.target.matches('[data-core-check]')){const s=task(e.target.dataset.day,e.target.dataset.coreCheck);s.checked=e.target.checked;s.status=s.checked?'completed':'pending';save();update()}if(e.target.matches('[data-extra-check]')){const s=task(e.target.dataset.day,e.target.dataset.extraCheck);s.extra_checked=e.target.checked;save()}if(e.target.matches('[data-self-check]')){const s=task(e.target.dataset.day,e.target.dataset.selfCheck);s.checked=e.target.checked;s.status=s.checked?'completed':'pending';save()}});
    function dayCount(day){const ids=core[day];return{done:ids.filter(id=>isComplete(day,id)).length,total:ids.length}}
    function wrongFor(day){return Object.entries(dayState(day)).reduce((n,[id,x])=>n+(['MID_A1','FIM_A1'].includes(id)?0:(Number(x.attempts)||0)),0)}
    function updateLocks(){document.querySelectorAll('article.quiz-card').forEach(card=>{const parts=[...card.querySelectorAll('.part-question[data-quiz]')];parts.forEach((part,i)=>{part.hidden=i>0&&task(q[parts[i-1].dataset.quiz].day,parts[i-1].dataset.quiz).status!=='completed'})})}
    function update(){updateLocks();const p=progress();state.progress={completedCoreTasks:p.done,totalCoreTasks:p.total,percent:p.percent};const active=document.querySelector('.tab.active')?.dataset.tab||state.activeTab;const shown=core[active]?dayCount(active):p;document.getElementById('progressBar').style.width=(core[active]?Math.round(shown.done/shown.total*100):p.percent)+'%';document.getElementById('progressTrack').setAttribute('aria-valuenow',String(core[active]?Math.round(shown.done/shown.total*100):p.percent));document.getElementById('progressLabel').textContent=core[active]?`${shown.done} af ${shown.total} kjarnaatriðum dagsins lokið`:`${p.done} af ${p.total} kjarnaatriðum lokið`;Object.keys(core).forEach(day=>document.querySelector(`[data-day-complete="${day}"]`)?.classList.toggle('show',dayCount(day).done===dayCount(day).total));const grid=document.getElementById('weekGrid');if(grid){grid.innerHTML='<div class="week-cell week-head">Dagur</div><div class="week-cell week-head">Lokið</div><div class="week-cell week-head">Staða</div><div class="week-cell week-head">Rangar</div>'+Object.keys(core).map(day=>{const c=dayCount(day);return `<div class="week-cell"><strong>${dayNames[day]}</strong></div><div class="week-cell">${c.done}/${c.total}</div><div class="week-cell">${c.done===c.total?'✓ Lokið':'○ Ólokið'}</div><div class="week-cell">${wrongFor(day)}</div>`}).join('');document.getElementById('weekProgress').textContent=p.percent+'%';document.getElementById('coreDone').textContent=`${p.done} af ${p.total}`;document.getElementById('wrongTotal').textContent=Object.keys(core).reduce((n,d)=>n+wrongFor(d),0)}}
    function switchTab(id,focus=false){state.activeTab=id;document.querySelectorAll('.tab').forEach(t=>{const on=t.dataset.tab===id;t.classList.toggle('active',on);t.setAttribute('aria-selected',String(on));t.tabIndex=on?0:-1});document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id==='panel-'+id));save();update();if(focus)document.getElementById('panel-'+id)?.focus();math()}
    document.querySelectorAll('.tab').forEach((tab,i)=>{tab.addEventListener('click',()=>switchTab(tab.dataset.tab,true));tab.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();let n=e.key==='Home'?0:e.key==='End'?tabs.length-1:e.key==='ArrowRight'?(i+1)%tabs.length:(i-1+tabs.length)%tabs.length;document.querySelectorAll('.tab')[n].focus();switchTab(tabs[n][0])})});
    Object.keys(q).forEach(renderQuiz);Object.keys(inputTasks).forEach(renderInput);Object.keys(matchTasks).forEach(renderMatch);switchTab(tabs.some(x=>x[0]===state.activeTab)?state.activeTab:'tuesday');update();math();
    window.__VIKA6_TEST__={state,core,q,inputTasks,matchTasks,parseValue,nearly,progress,dayCount,isComplete,save};
  })();
